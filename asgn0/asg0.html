<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw a blue rectangle (canvas version)</title>
  </head>

  <body onload="main()">
    <canvas id="example" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>

    <div style="margin-bottom: 5px">
      <label for="v1-x">v1:</label>
      <label for="v1-x">x</label>
      <input
        type="number"
        id="v1-x"
        />
      <label for="v1-y">y</label>
      <input
        type="number"
        id="v1-y"
        />
    </div>

    <div style="margin-bottom: 5px">
      <label for="v2-x">v2:</label>
      <label for="v2-x">x</label>
      <input
        type="number"
        id="v2-x"
        />
      <label for="v2-y">y</label>
      <input
        type="number"
        id="v2-y"
        />
    </div>

    <div style="margin-bottom: 20px">
    <input
      type="button"
      id="draw"
      value="Draw"
      />
    </div>

    <div style="margin-bottom: 5px">
      <label style="font-size: 20px;">Operation:</label>
      <select id="op-select">
        <option value="">--Select Operation--</option>
        <option value="add">Add</option>
        <option value="sub">Subtract</option>
        <option value="div">Divide</option>
        <option value="mul">Multiply</option>
        <option value="mag">Magnitude</option>
        <option value="norm">Normalize</option>
        <option value="ang">Angle between</option>
        <option value="area">Area</option>
      </select>

      <label style="font-size: 20px;">Scalar:</label>
      <input
        type="number"
        id="scalar"
        />
    </div>

    <div style="margin-bottom: 20px">
    <input
      type="button"
      id="drawOp"
      value="Draw"
      />
    </div>

    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="asg0.js"></script>
  </body>
</html>
