    <style>
      body { margin: 0; }
      .split {
        position: absolute;
        left: 0;

        width: 100%;
        height: 100%;
        display: flex;
      }
      .split>div {
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
      }
    }
</script>
  </head>
  <body>
    <canvas id="c"></canvas>
      <div class="split">
        <div id="view1" tabindex="1"></div>
        <div id="view2" tabindex="2"></div>
      </div>
    <script type="module" src="camera.js"></script>
    <script type="module" src="asgn5.js"></script>

</html>
